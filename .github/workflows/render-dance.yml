name: Render dance video

on:
  workflow_dispatch:
  push:
    branches: [ccr-a14dbc23-mcr5vw]
    paths: ["src/dance/**", "public/audio/dance_*", "scripts/render_dance_gh.sh", ".github/workflows/render-dance.yml"]

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        range: ["0-195", "196-391", "392-587", "588-783", "784-979", "980-1175", "1176-1371", "1372-1567", "1568-1763", "1764-1959", "1960-2155", "2156-2351", "2352-2547", "2548-2743", "2744-2939"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2 libatk-bridge2.0-0 libpango-1.0-0 libcairo2
      - run: npm ci --no-audit --no-fund
      - run: npx remotion browser ensure
      - name: Render frames ${{ matrix.range }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts Dance "out/chunk_${{ matrix.range }}.mp4" --frames=${{ matrix.range }} --gl=swangle --concurrency=2 --crf=16 --pixel-format=yuv420p --muted --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.range }}
          path: out/*.mp4
          retention-days: 2

  assemble:
    needs: chunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with: { path: chunks, pattern: "chunk-*", merge-multiple: true }
      - name: Concatenate chunks, limit the mix, mux (one AAC encode, TV range bt709)
        run: |
          mkdir -p final
          ls chunks | sort -t_ -k2 -n > /tmp/order.txt
          : > /tmp/list.txt
          for f in $(cat /tmp/order.txt); do echo "file '$PWD/chunks/$f'" >> /tmp/list.txt; done
          ffmpeg -y -f concat -safe 0 -i /tmp/list.txt -c copy /tmp/video.mp4
          ffmpeg -v error -y -i public/audio/dance_mix.wav -af "aresample=192000,alimiter=limit=0.8:level=false:attack=1:release=60,aresample=48000,volume=-1dB" -c:a pcm_s24le /tmp/mix_lim.wav
          ffmpeg -y -i /tmp/video.mp4 -i /tmp/mix_lim.wav -map 0:v -map 1:a -vf "scale=in_range=full:out_range=tv,format=yuv420p" -color_range tv -colorspace bt709 -color_primaries bt709 -color_trc bt709 -c:v libx264 -crf 17 -preset slow -c:a aac -b:a 192k -shortest -movflags +faststart final/tanzevalnaya_chuma.mp4
          ffmpeg -y -i final/tanzevalnaya_chuma.mp4 -c:v libx264 -preset slow -b:v 2600k -c:a aac -b:a 128k -movflags +faststart final/tanzevalnaya_chuma_phone.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 final/tanzevalnaya_chuma.mp4
          ls -la final
      - uses: actions/upload-artifact@v4
        with:
          name: dance-video
          path: final/*.mp4
