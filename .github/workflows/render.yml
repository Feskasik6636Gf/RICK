name: Render video

on:
  workflow_dispatch:
  push:
    branches: [claude/new-session-hmfcy1]
    paths: ["src/**", "public/**", "scripts/**", "package.json", ".github/workflows/render.yml"]

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        range: ["0-237", "238-475", "476-713", "714-951", "952-1189", "1190-1427", "1428-1665", "1666-1903", "1904-2141", "2142-2379", "2380-2617", "2618-2851"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2 libatk-bridge2.0-0 libpango-1.0-0 libcairo2
      - run: npm ci --no-audit --no-fund
      - run: npx remotion browser ensure
      - name: Render frames ${{ matrix.range }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts Film "out/chunk_${{ matrix.range }}.mp4" --frames=${{ matrix.range }} --gl=swangle --concurrency=4 --crf=16 --pixel-format=yuv420p --muted --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.range }}
          path: out/*.mp4
          retention-days: 2

  assemble:
    needs: chunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg && pip install numpy scipy
      - uses: actions/download-artifact@v4
        with: { path: chunks, pattern: "chunk-*", merge-multiple: true }
      - name: Mix audio (voice + wind, drone, effects)
        run: python3 scripts/mix.py
      - name: Concatenate chunks and mux sound
        run: |
          mkdir -p final
          ls chunks | sort -t_ -k2 -n > /tmp/order.txt
          : > /tmp/list.txt
          for f in $(cat /tmp/order.txt); do echo "file '$PWD/chunks/$f'" >> /tmp/list.txt; done
          cat /tmp/list.txt
          ffmpeg -y -f concat -safe 0 -i /tmp/list.txt -c copy /tmp/video.mp4
          ffmpeg -y -i /tmp/video.mp4 -i public/audio/mix.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart final/dyatlov_pass.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 final/dyatlov_pass.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: dyatlov-pass-video
          path: final/dyatlov_pass.mp4
